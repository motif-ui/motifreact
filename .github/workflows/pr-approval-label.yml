name: PR Approval Label

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [reopened]

permissions:
  pull-requests: write

jobs:
  sync_approved_label:
    runs-on: ubuntu-latest
    steps:
      - name: Sync approved label with review state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const APPROVED_LABEL = 'approved';
            const prNumber = context.payload.pull_request.number;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Keep only the latest APPROVED/CHANGES_REQUESTED review per reviewer,
            // mirroring how GitHub itself derives PR review status: dismissed
            // reviews and plain comments don't count, and a reviewer's newer
            // review always supersedes their older one.
            const latestByReviewer = new Map();
            for (const review of reviews) {
              if (review.state !== 'APPROVED' && review.state !== 'CHANGES_REQUESTED') {
                continue;
              }
              latestByReviewer.set(review.user.id, review.state);
            }

            const states = [...latestByReviewer.values()];
            const isApproved =
              states.length > 0 && states.every((state) => state === 'APPROVED');

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const hasApprovedLabel = labels.some((label) => label.name === APPROVED_LABEL);

            if (isApproved && !hasApprovedLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [APPROVED_LABEL],
              });
            } else if (!isApproved && hasApprovedLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: APPROVED_LABEL,
              });
            }
