name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          include_fix_links: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the motifreact component library.

            Before reviewing, read the review rules in the repository and apply them:
            - docs/review/general.md: always.
            - docs/review/figma.md: when the PR changes generated token files or the look of a migrated component.
            - docs/review/tests.md: when the PR touches any *.test.tsx file or changes a component's default prop values.
            - docs/review/css.md: when the PR touches any .scss file; only for the lines it adds or modifies, except
              section 0 (.Root), which applies to the whole file including removed lines. A missing .Root is blocking:
              start the summary comment with it.
            - docs/review/design-tokens.md: only for migrated components (their SCSS uses --mtf-* variables or their
              variant uses VariantV2) and for src/scripts/tokens; see its Scope note. Skip components that still use
              only the old --theme-* layer. Check every changed SCSS line of a migrated component against it, including
              values hidden in SCSS maps, size tables and mixin arguments. When a comment comes from one of these rules,
              name the rule section.

            Note: The PR branch is already checked out in the current working directory.
            Note: Do not try to run test, tsc, lint or similar scripts, as those are already run in the CI pipeline. Focus on code review and analysis.

            Use `mcp__github_comment__update_claude_comment` for top-level feedback - this updates your single tracking comment
            in place, so do not use `gh pr comment` for the summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
