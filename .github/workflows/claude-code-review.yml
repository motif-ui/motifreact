name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          include_fix_links: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the motifreact component library with a focus on:
            - Code quality and best practices
            - Correctness and potential bugs
            - React/TypeScript best practices
            - SCSS/styling concerns
            - Test coverage gaps for changed components
            - Breaking changes in component APIs
            - Security implications
            - Performance considerations
            
            Pay attention to the following guidelines:
            - Do not allow "var" or "let" in the codebase, and prefer "const" and functional programming patterns.
            - Avoid using "any" type in TypeScript, and prefer explicit types or generics.
            - ES6+ syntax should be used throughout the codebase: arrow functions, destructuring, template literals, 
              nullish coalescing, dual ampersand, optional chaining...
            - Do not allow usages like "React.MouseEvent". "React" should be imported along with other imports.
            
            In tests:
            - Each component test suite should start with a test: "should be rendered with only required props and 
              should have default prop values stated here" which should test the component with only required props and 
              check for default prop values.
            - Force to create consts instead of using the same hardcoded text multiple times.
            - Avoid unrelated-unnecessary props in tests, and only use props that are relevant to the test case.
            

            Note: The PR branch is already checked out in the current working directory.
            Note: Do not try to run test, tsc, lint or similar scripts, as those are already run in the CI pipeline. Focus on code review and analysis.

            Use `mcp__github_comment__update_claude_comment` for top-level feedback - this updates your single tracking comment
            in place, so do not use `gh pr comment` for the summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
