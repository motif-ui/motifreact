name: UI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for storybook changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            storybook:
              - 'package.json'
              - '.storybook/**'
              - 'src/docs/**'

  chromatic:
    name: Chromatic
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: '0'
          persist-credentials: 'false'

      - uses: ./.github/actions/setup-node-deps

      # --- Playwright Steps (Run conditionally BEFORE Chromatic) ---
      - name: Cache Playwright browsers
        if: needs.detect-changes.outputs.storybook == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: needs.detect-changes.outputs.storybook == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        if: needs.detect-changes.outputs.storybook == 'true'
        run: npx playwright test

      # --- Single Chromatic Execution ---
      - name: Run Chromatic
        uses: chromaui/action@94713c544284a14195de3b50ef24301579f1877e # v18.0.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          zip: true
          buildScriptName: "build:storybook"
          playwright: ${{ needs.detect-changes.outputs.storybook == 'true' }}
          skip: "dependabot/**"
          autoAcceptChanges: "main"
          exitOnceUploaded: true
          ignoreLastBuildOnBranch: ${{ github.head_ref }}